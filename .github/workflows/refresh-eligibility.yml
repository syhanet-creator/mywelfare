name: 자격조건 갱신 (Gemini)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번에 처리할 최대 서비스 수 (0 = 전부)"
        default: "0"
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 03:17 (KST)

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 자격조건 추출
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python tools/extract_eligibility.py --limit "${{ github.event.inputs.limit || 0 }}" --max-minutes 320
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eligibility.json
          git diff --cached --quiet || (git commit -m "자격조건 데이터 갱신" && git push)
